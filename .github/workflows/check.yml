name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Self-test the gate
        run: scripts/tests/check_test.sh
      - name: Self-test the build and play scripts
        run: scripts/tests/build_test.sh
      - name: Run the gate
        run: scripts/check.sh
